<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DHT</title>
<meta name="theme-color" content="#0d0f2b">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<header id="hd">
  <a class="brand" href="#/" aria-label="DHT"><picture><source srcset="assets/logo.webp" type="image/webp"><img src="assets/logo.png" alt="DHT"></picture></a>
  <nav>
    <a href="#/game/tinyland" data-n="tinyland"><span>🌾</span>Tinyland</a>
    <a href="#/trochoi" data-n="trochoi"><span>🎮</span>Trò mini</a>
  </nav>
  <button id="adm"></button>
</header>

<main id="app"></main>

<dialog id="dlg">
  <h3>Tài khoản DHT</h3>
  <input id="un" type="text" placeholder="Tên đăng nhập" autocomplete="username">
  <input id="pw" type="password" placeholder="Mật khẩu (từ 6 ký tự)" autocomplete="current-password">
  <p id="er"></p>
  <div class="row"><button class="btn" id="li">Đăng nhập</button> <button class="btn g" id="rg">Tạo tài khoản</button> <button class="btn g" id="cl">Đóng</button></div>
</dialog>
<dialog id="dlg2"></dialog>

<script src="app.js"></script>
</body>
</html>
