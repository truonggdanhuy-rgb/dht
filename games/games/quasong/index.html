<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<style>body{font-family:Georgia,serif;background:#eef8f0;text-align:center;margin:0;padding:12px;color:#1f3a30}#g{display:flex;gap:6px;max-width:460px;margin:12px auto;align-items:stretch}.bk{flex:1;min-height:200px;background:#cfe9c4;border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;justify-content:center}.rv{width:70px;background:#a8d8ee;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px}.bk button{font-size:36px;border:0;border-radius:12px;background:#fff;padding:6px;cursor:pointer}.m{padding:8px 14px;border:0;border-radius:10px;background:#4f9f7f;color:#fff;margin:3px;cursor:pointer}p{margin:6px 14px}</style>
<h2 style="margin:4px">Qua sông</h2><p style="font-size:14px">Đưa cả 4 sang bờ phải. Bấm vào con vật để nông dân chở sang cùng, bấm 🧑‍🌾 để đi một mình. Bỏ lại không có nông dân: 🐺 ăn 🐐, 🐐 ăn 🥬.</p>
<div id=g><div class=bk id=l></div><div class=rv id=r></div><div class=bk id=rt></div></div><p id=m style="font-weight:bold;min-height:22px"></p><p id=s></p><button class=m onclick=rs()>Chơi lại</button>
<script>
const N={f:'🧑‍🌾',w:'🐺',g:'🐐',c:'🥬'};let P,mv,over,best=+localStorage.quasongBest||0,W=+localStorage.quasongWins||0;
function draw(){[l,rt].forEach((el,side)=>{el.innerHTML='';for(const k in N)if(P[k]==side){const b=document.createElement('button');b.textContent=N[k];b.onclick=()=>go(k);el.appendChild(b)}});r.textContent=P.f?'⬅️🚣':'🚣➡️';s.textContent=`Lượt: ${mv} · Kỷ lục: ${best||'-'} (tối ưu 7) · Đã thắng ${W} lần`}
function go(k){if(over)return;if(k!='f'&&P[k]!=P.f)return;const to=1-P.f;P.f=to;if(k!='f')P[k]=to;mv++;
 const o=1-to,on=x=>P[x]==o;let bad='';if(on('w')&&on('g'))bad='Sói đã ăn dê! 🐺';else if(on('g')&&on('c'))bad='Dê đã ăn cải! 🐐';
 if(bad){over=1;m.textContent=bad+' Chơi lại nhé.'}else if(P.w&&P.g&&P.c&&P.f){over=1;W++;localStorage.quasongWins=W;if(!best||mv<best){best=mv;localStorage.quasongBest=best}m.textContent='Hoàn thành trong '+mv+' lượt! 🎉'}draw()}
function rs(){P={f:0,w:0,g:0,c:0};mv=0;over=0;m.textContent='';draw()}rs()
</script>
