const TN_NEED=10;

const TN_MON=[40,49],TN_V=3;   // số quái vật phải câu: từ..đến • TN_V: tăng số này để ép sinh lại danh sách khi đổi cân bằng

function tnWk(){const d=new Date(),k=(d.getDay()+6)%7;return new Date(d.getFullYear(),d.getMonth(),d.getDate()-k).getTime()}
function tnRng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function tnGen(wk){const wi=Math.round((wk/864e5-4)/7),per=Math.floor(TN_DISH.length/5),cyc=Math.floor(wi/per),ph=((wi%per)+per)%per,R0=tnRng(cyc*7919+13),pool=TN_DISH.slice();
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(R0()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 const R=tnRng(wi*104729+7),q=[];
 pool.slice(ph*5,ph*5+5).forEach(n=>{const o=PRODS.find(x=>x.n==n),hard=o&&(o.ing.length>=3||o.ing.reduce((a,i)=>a+i.n,0)>=4),r=hard?TN_COOK2:TN_COOK;
  q.push({k:'cook',n,need:r[0]+Math.floor(R()*(r[1]-r[0]+1)),p:0,done:0})});

 return pool.slice(0,5).map(k=>{const r=POTS[k][2]>=TI_LONG?TI_R2:TI_R1;return{k,need:r[0]+Math.floor(R()*(r[1]-r[0]+1)),p:0,done:0}})}

 if(id=='chieng'){const u=((t%CH_T)+CH_T)%CH_T,k=chK(u),h=Math.round(5-2*k);return{d:0,lift:chAge(u)<.07?1:0,aup:[h,h]}}
 if(id=='hoanho'){const u=((t%HH_T)+HH_T)%HH_T,j=u<.75?Math.sin(Math.PI*u/.75)*9:0,w=Math.floor(t*7)%2;return{d:0,lift:j,aup:[8-w,7+w],e:5}}
 return{d:0,lift:0}};

 r(c[1],x-1,y-1,3,3);r(c[1],x-2,y,5,1);r(c[1],x,y-2,1,1);r(c[1],x,y+2,1,1);r(c[0],x-1,y-1,1,1);r(c[0],x,y-2,1,1);r(c[2],x+1,y+1,1,1);r(c[2],x,y+2,1,1);r(c[2],x+2,y,1,1);

 E(r,'#5a3a0c',x,y,4,4);E(r,'#c9921e',x,y,3,3);E(r,'#f2c53d',x,y,2,2);r('#a8741a',x,y,1,1);

 r('#a8201a',bx-5,by+3,7,9);r('#d9302a',bx-5,by+3,7,2);r('#6a1410',bx-5,by+10,2,2);r('#6a1410',bx-3,by+8,2,2);          // đuôi ruy băng trái

 g.lineWidth=2.6;g.strokeStyle='#5a0f0c';g.strokeText('Hoan hô',X+.5,by+8.5);g.fillStyle='#fff6d0';g.fillText('Hoan hô',X+.5,by+8.5);g.restore();

  for(let i=0;i<7;i++){const a=t*2.1+i*Math.PI*2/7,s=Math.sin(a);if(s<0)gem(X+Math.cos(a)*17,Y-17+s*6+Math.sin(t*3+i)*1.6,i,Math.sin(t*5+i*2))}},
